[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "download-model-pipeline"
version = "0.1.0"
description = "A portable Hugging Face model-to-HDFS ingestion pipeline."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "huggingface-hub==0.34.3",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
download-model = "download_model_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -m 'not integration'"
markers = [
  "integration: requires external network access and real Hugging Face downloads",
]
