[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-artifact-transfer"
version = "0.2.0"
description = "Portable model-artifact transfer primitives with pluggable source and destination backends."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "boto3>=1.34,<2",
  "huggingface-hub==0.34.3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
model-artifact-transfer = "model_artifact_transfer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -m 'not integration'"
markers = [
  "integration: requires external network access and real Hugging Face downloads",
]
